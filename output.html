<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メッセージ表示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: white;
            color: black;
            min-height: 100vh;
            padding: 40px;
        }
        
        .name {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        
        .message {
            font-size: 72px;
            font-weight: bold;
            line-height: 1.3;
            word-wrap: break-word;
        }
        
        .no-data {
            font-size: 48px;
            color: #666;
        }
    </style>
</head>
<body>
    <div id="displayContent">
        <div class="no-data">データを読み込み中...</div>
    </div>

    <script>
        // ここにGoogle Apps ScriptのウェブアプリURLを貼り付けてください
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbz_m5BxKsXMI5zdL7bon105qCpJL1pCTp9zCyBqCJ7B2-_xKlVLId9iDHf1EigP5OHs1A/exec';
        
        const displayContent = document.getElementById('displayContent');
        
        let lastRendered = null;

        function render(key, build) {
            // 内容が変わったときだけ描画（ちらつき防止）
            if (key === lastRendered) return;
            lastRendered = key;
            displayContent.replaceChildren(build());
        }

        function el(className, text) {
            const div = document.createElement('div');
            div.className = className;
            div.textContent = text; // textContentでXSSを防ぐ
            return div;
        }

        async function loadAndDisplayData() {
            try {
                const response = await fetch(GAS_URL);
                const result = await response.json();

                if (result.data && result.data.name) {
                    const name = String(result.data.name);
                    const message = String(result.data.message ?? '');
                    render(JSON.stringify([name, message]), () => {
                        const frag = document.createDocumentFragment();
                        frag.append(el('name', `${name}より`), el('message', message));
                        return frag;
                    });
                } else {
                    render('empty', () => el('no-data', 'データがありません'));
                }
            } catch (error) {
                // 通信エラー時は直前の表示を残す（初回のみエラー表示）
                console.error('Error loading data:', error);
                if (lastRendered === null) {
                    render('error', () => el('no-data', '読み込みエラー'));
                }
            }
        }
        
        // 初回読み込み
        loadAndDisplayData();
        
        // 3秒ごとに自動更新
        setInterval(loadAndDisplayData, 3000);
    </script>
</body>
</html>
